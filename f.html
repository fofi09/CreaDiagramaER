    function buildFallback(form) {
      if (form.templateId && TEMPLATE_FALLBACKS[form.templateId]) {
        return TEMPLATE_FALLBACKS[form.templateId];
      }
      const names = (form.knownEntities || "").split(",").map((s) => s.trim()).filter(Boolean);
      const finalNames = names.length ? names : ["entidad_1", "entidad_2", "entidad_3"];
      const colors = Object.keys(COLOR_THEMES);
      const entities = finalNames.map((n, idx) => ({
        name: n.toLowerCase().replace(/\s+/g, "_"),
        color: colors[idx % colors.length],
        attributes: [{ name: "id", type: "INT", pk: true, isNull: false, isUnique: true }, { name: "nombre", type: "VARCHAR(100)", isNull: false }],
      }));
      const relationships = [];
      for (let i = 0; i < finalNames.length - 1; i++) {
        relationships.push({ from: entities[i].name, to: entities[i + 1].name, cardinalityFrom: "one", cardinalityTo: "many", label: "se_relaciona_con" });
      }
      return { entities, relationships };
    }

    function buildPrompt(form) {
      return `Sos un experto en diseño de bases de datos relacionales. A partir de la siguiente descripción de un sistema, generá un modelo entidad-relación completo.

Descripción del sistema: ${form.description}

Nivel de detalle deseado: ${form.detailLevel} (basico = solo atributos esenciales; intermedio = atributos comunes de un sistema real; avanzado = incluir campos de auditoría como fechas de creación/actualización y estados cuando corresponda).
${form.mustHave ? `Elementos que no pueden faltar: ${form.mustHave}.` : ""}
${form.knownEntities ? `Entidades que el usuario ya tiene en mente (incluilas sin falta): ${form.knownEntities}.` : ""}

Devolvé EXCLUSIVAMENTE un objeto JSON válido, sin texto adicional, sin explicaciones, sin bloques de markdown, con exactamente esta forma:
{"entities":[{"name":"nombre_tabla","attributes":[{"name":"nombre_campo","type":"INT|VARCHAR(n)|TEXT|DATE|DATETIME|DECIMAL(10,2)|BOOLEAN","pk":true,"fk":false}]}],"relationships":[{"from":"nombre_tabla","to":"otra_tabla","cardinalityFrom":"one|many","cardinalityTo":"one|many","label":"verbo"}]}

Reglas: cada entidad debe tener una clave primaria "id" de tipo INT marcada pk:true. Los campos de clave foránea deben tener fk:true. Usá nombres de tablas y campos en minúsculas con snake_case.`;
    }

    function layoutEntities(list) {
      const n = list.length;
      const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
      const cellW = 320;
      const cellH = 260;
      const colors = Object.keys(COLOR_THEMES);
      return list.map((e, i) => ({
        ...e,
        color: e.color || colors[i % colors.length],
        x: 60 + (i % cols) * cellW,
        y: 60 + Math.floor(i / cols) * cellH,
      }));
    }

    function getBestAnchor(source, target) {
      const hSource = cardHeight(source.attributes.length);
      const hTarget = cardHeight(target.attributes.length);

      const c1 = { x: source.x + CARD_W / 2, y: source.y + hSource / 2 };
      const c2 = { x: target.x + CARD_W / 2, y: target.y + hTarget / 2 };

      const dx = c2.x - c1.x;
      const dy = c2.y - c1.y;

      let p1 = { ...c1 }, p2 = { ...c2 };

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) {
          p1 = { x: source.x + CARD_W, y: c1.y };
          p2 = { x: target.x, y: c2.y };
        } else {
          p1 = { x: source.x, y: c1.y };
          p2 = { x: target.x + CARD_W, y: c2.y };
        }
      } else {
        if (dy > 0) {
          p1 = { x: c1.x, y: source.y + hSource };
          p2 = { x: c2.x, y: target.y };
        } else {
          p1 = { x: c1.x, y: source.y };
          p2 = { x: c2.x, y: target.y + hTarget };
        }
      }

      return { p1, p2, dx, dy };
    }

    function SqlExportModal({ entities, relationships, onClose }) {
      const [dialect, setDialect] = useState("postgresql");
      const [copied, setCopied] = useState(false);

      const sqlCode = useMemo(() => {
        let code = `-- Generado automáticamente por ER Studio\n-- Dialecto: ${dialect.toUpperCase()}\n\n`;

        entities.forEach((ent) => {
          code += `CREATE TABLE ${ent.name} (\n`;
          const lines = [];
          const pkFields = [];

          ent.attributes.forEach((attr) => {
            let line = `  ${attr.name} ${attr.type}`;
            if (!attr.isNull && !attr.pk) line += " NOT NULL";
            if (attr.isUnique) line += " UNIQUE";
            lines.push(line);
            if (attr.pk) pkFields.push(attr.name);
          });

          if (pkFields.length > 0) {
            lines.push(`  PRIMARY KEY (${pkFields.join(", ")})`);
          }

          code += lines.join(",\n");
          code += `\n);\n\n`;
        });

        relationships.forEach((rel) => {
          const fromEnt = entities.find((e) => e.id === rel.from);
          const toEnt = entities.find((e) => e.id === rel.to);
          if (fromEnt && toEnt) {
            const fkAttr = toEnt.attributes.find((a) => a.fk) || { name: `${fromEnt.name}_id` };
            const pkAttr = fromEnt.attributes.find((a) => a.pk) || { name: "id" };
            code += `-- Relación: ${fromEnt.name} -> ${toEnt.name}\n`;
            code += `ALTER TABLE ${toEnt.name} ADD CONSTRAINT fk_${toEnt.name}_${fromEnt.name}\n`;
            code += `  FOREIGN KEY (${fkAttr.name}) REFERENCES ${fromEnt.name}(${pkAttr.name});\n\n`;
          }
        });

        return code;
      }, [entities, relationships, dialect]);

      const handleCopy = () => {
        navigator.clipboard.writeText(sqlCode);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[88vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800">
              <div className="flex items-center gap-2.5">
                <CodeIcon className="text-cyan-400" size={20} />
                <h3 className="font-display font-bold text-lg text-slate-100">Exportar Script SQL</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-100 p-1.5 rounded-lg">
                <XIcon size={18} />
              </button>
            </div>

            <div className="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-400 font-display">SGBD:</span>
                {["postgresql", "mysql", "sqlite"].map((d) => (
                  <button
                    key={d}
                    onClick={() => setDialect(d)}
                    className={`text-xs px-3 py-1 rounded-lg font-mono capitalize border ${dialect === d ? "bg-cyan-500/20 text-cyan-300 border-cyan-500/50" : "bg-slate-900 text-slate-400 border-slate-800"}`}
                  >
                    {d}
                  </button>
                ))}
              </div>

              <button
                onClick={handleCopy}
                className="flex items-center gap-1.5 text-xs bg-cyan-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg hover:bg-cyan-400 transition-colors"
              >
                {copied ? <CheckIcon size={14} /> : <CodeIcon size={14} />}
                {copied ? "¡Copiado!" : "Copiar SQL"}
              </button>
            </div>

            <div className="p-4 overflow-y-auto flex-1 font-mono text-xs text-cyan-200 bg-slate-950 leading-relaxed whitespace-pre select-all">
              {sqlCode}
            </div>
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Componente Principal y Flujo                                       */
    /* ------------------------------------------------------------------ */
    const initialForm = {
      templateId: null,
      projectName: "",
      description: "",
      detailLevel: "intermedio",
      mustHave: "",
      knownEntities: "",
    };

    function ERDiagramStudio() {
      const [step, setStep] = useState("setup"); // 'setup' | 'questionnaire' | 'loading' | 'editor'
      const [form, setForm] = useState(initialForm);

      // Estado del editor
      const [entities, setEntities] = useState([]);
      const [relationships, setRelationships] = useState([]);
      const [selectedEntityId, setSelectedEntityId] = useState(null);
      const [selectedRelId, setSelectedRelId] = useState(null);
      
      const [toolMode, setToolMode] = useState("select"); // 'select' | 'connect' | 'pan'
      const [connectFrom, setConnectFrom] = useState(null);
      const [editingEntityModalId, setEditingEntityModalId] = useState(null);
      const [showSqlModal, setShowSqlModal] = useState(false);
      
      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isPanning, setIsPanning] = useState(false);
      const [panStart, setPanStart] = useState({ x: 0, y: 0 });
      const [dragState, setDragState] = useState(null);
      const [snapToGrid, setSnapToGrid] = useState(true);

      const [history, setHistory] = useState([]);
      const [historyIdx, setHistoryIdx] = useState(-1);

      const svgRef = useRef(null);

      const pushHistory = useCallback((newEntities, newRels) => {
        const nextState = { entities: newEntities, rels: newRels };
        setHistory((prev) => [...prev.slice(0, historyIdx + 1), nextState]);
        setHistoryIdx((prev) => prev + 1);
      }, [historyIdx]);

      const undo = () => {
        if (historyIdx > 0) {
          const prev = history[historyIdx - 1];
          setEntities(prev.entities);
          setRelationships(prev.rels);
          setHistoryIdx(historyIdx - 1);
        }
      };

      const redo = () => {
        if (historyIdx < history.length - 1) {
          const next = history[historyIdx + 1];
          setEntities(next.entities);
          setRelationships(next.rels);
          setHistoryIdx(historyIdx + 1);
        }
      };

      function pickTemplate(t) {
        setForm({ ...initialForm, templateId: t.id, projectName: t.name, description: t.description });
        setStep("questionnaire");
      }

      function pickCustom() {
        setForm({ ...initialForm, templateId: null, projectName: "", description: "" });
        setStep("questionnaire");
      }

      function loadDiagram(rawEntities, rawRelationships) {
        const nameToId = {};
        const newEntities = (rawEntities || []).map((e) => {
          const id = uid();
          nameToId[e.name] = id;
          return {
            id,
            name: e.name,
            color: e.color,
            x: 0,
            y: 0,
            attributes: (e.attributes || []).map((a) => ({
              id: uid(),
              name: a.name,
              type: a.type || "VARCHAR(100)",
              pk: !!a.pk,
              fk: !!a.fk,
              isNull: a.isNull !== undefined ? a.isNull : !a.pk,
              isUnique: !!a.isUnique || !!a.pk,
            })),
          };
        });

        const laidOut = layoutEntities(newEntities);
        const newRels = (rawRelationships || [])
          .map((r) => {
            const fromId = nameToId[r.from];
            const toId = nameToId[r.to];
            if (!fromId || !toId) return null;
            return {
              id: uid(),
              from: fromId,
              to: toId,
              cardinalityFrom: r.cardinalityFrom === "many" ? "many" : "one",
              cardinalityTo: r.cardinalityTo === "many" ? "many" : "one",
              label: r.label || "",
            };
          })
          .filter(Boolean);

        setEntities(laidOut);
        setRelationships(newRels);
        setSelectedEntityId(null);
        setSelectedRelId(null);
        
        // En móviles arrancamos con zoom al 65% para que las tablas entren enteras a lo ancho sin cortarse
        const isMobile = typeof window !== "undefined" && window.innerWidth < 768;
        setZoom(isMobile ? 0.65 : 1);
        setPan({ x: 0, y: 0 });
        setHistory([{ entities: laidOut, rels: newRels }]);
        setHistoryIdx(0);
      }

      async function handleGenerate() {
        setStep("loading");
        try {
          const resp = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 2000,
              messages: [{ role: "user", content: buildPrompt(form) }],
            }),
          });
          const data = await resp.json();
          const text = (data.content || []).map((b) => b.text || "").join("\n");
          const match = text.match(/\{[\s\S]*\}/);
          if (!match) throw new Error("Sin JSON en la respuesta");
          const parsed = JSON.parse(match[0]);
          if (!Array.isArray(parsed.entities)) throw new Error("Forma inválida");
          loadDiagram(parsed.entities, parsed.relationships || []);
        } catch (err) {
          console.error("Generación con IA falló, usando datos de respaldo:", err);
          const fb = buildFallback(form);
          loadDiagram(fb.entities, fb.relationships);
        }
        setStep("editor");
      }

      const getEntity = (id) => entities.find((e) => e.id === id);
      const selectedEntity = getEntity(selectedEntityId);
      const modalEntity = getEntity(editingEntityModalId);
      const selectedRel = relationships.find((r) => r.id === selectedRelId);

      const updateEntity = (id, patch) => {
        const updated = entities.map((e) => (e.id === id ? { ...e, ...patch } : e));
        setEntities(updated);
      };

      const deleteEntity = (id) => {
        const updatedEnts = entities.filter((e) => e.id !== id);
        const updatedRels = relationships.filter((r) => r.from !== id && r.to !== id);
        setEntities(updatedEnts);
        setRelationships(updatedRels);
        setSelectedEntityId(null);
        if (editingEntityModalId === id) setEditingEntityModalId(null);
        pushHistory(updatedEnts, updatedRels);
      };

      const addAttribute = (entId, customDefaults = {}) => {
        const updated = entities.map((e) => {
          if (e.id !== entId) return e;
          return {
            ...e,
            attributes: [
              ...e.attributes,
              {
                id: uid(),
                name: customDefaults.name || `campo_${e.attributes.length + 1}`,
                type: customDefaults.type || "VARCHAR(100)",
                pk: false,
                fk: false,
                isNull: true,
                isUnique: false
              }
            ]
          };
        });
        setEntities(updated);
        pushHistory(updated, relationships);
      };

      const updateAttribute = (entId, attrId, patch) => {
        const updated = entities.map((e) => {
          if (e.id !== entId) return e;
          return {
            ...e,
            attributes: e.attributes.map((a) => (a.id === attrId ? { ...a, ...patch } : a))
          };
        });
        setEntities(updated);
      };

      const deleteAttribute = (entId, attrId) => {
        const updated = entities.map((e) => {
          if (e.id !== entId) return e;
          return {
            ...e,
            attributes: e.attributes.filter((a) => a.id !== attrId)
          };
        });
        setEntities(updated);
        pushHistory(updated, relationships);
      };

      const moveAttribute = (entId, index, direction) => {
        const updated = entities.map((e) => {
          if (e.id !== entId) return e;
          const newAttrs = [...e.attributes];
          const targetIdx = index + direction;
          if (targetIdx < 0 || targetIdx >= newAttrs.length) return e;
          const temp = newAttrs[index];
          newAttrs[index] = newAttrs[targetIdx];
          newAttrs[targetIdx] = temp;
          return { ...e, attributes: newAttrs };
        });
        setEntities(updated);
      };

      const createNewEntity = () => {
        const newId = uid();
        const colors = Object.keys(COLOR_THEMES);
        const newEntity = {
          id: newId,
          name: `tabla_${entities.length + 1}`,
          color: colors[entities.length % colors.length],
          x: Math.round((-pan.x + 200 + (entities.length % 3) * 40) / 15) * 15,
          y: Math.round((-pan.y + 150 + (entities.length % 3) * 40) / 15) * 15,
          attributes: [
            { id: uid(), name: "id", type: "INT", pk: true, fk: false, isNull: false, isUnique: true },
            { id: uid(), name: "nombre", type: "VARCHAR(100)", pk: false, fk: false, isNull: false }
          ]
        };
        const updatedEnts = [...entities, newEntity];
        setEntities(updatedEnts);
        setSelectedEntityId(newId);
        setEditingEntityModalId(newId);
        pushHistory(updatedEnts, relationships);
      };

      // Arrastre mejorado: Al tocar el fondo del lienzo en celular o computadora, siempre permite arrastrar la vista
      const handlePointerDownCanvas = (e) => {
        setIsPanning(true);
        setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
        setSelectedEntityId(null);
        setSelectedRelId(null);
      };

      const handlePointerMoveCanvas = (e) => {
        if (isPanning) {
          setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
          return;
        }

        if (dragState) {
          let rawX = dragState.origX + (e.clientX - dragState.startX) / zoom;
          let rawY = dragState.origY + (e.clientY - dragState.startY) / zoom;

          if (snapToGrid) {
            rawX = Math.round(rawX / 15) * 15;
            rawY = Math.round(rawY / 15) * 15;
          }

          updateEntity(dragState.entityId, { x: Math.max(0, rawX), y: Math.max(0, rawY) });
        }
      };

      const handlePointerUpCanvas = () => {
        if (isPanning) setIsPanning(false);
        if (dragState) {
          setDragState(null);
          pushHistory(entities, relationships);
        }
      };

      const handleWheelZoom = (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
          setZoom((z) => Math.min(2.2, Math.max(0.4, z * zoomFactor)));
        }
      };

      const handleEntityPointerDown = (e, ent) => {
        e.stopPropagation();
        if (toolMode === "connect") {
          if (!connectFrom) {
            setConnectFrom(ent.id);
          } else if (connectFrom !== ent.id) {
            const newRel = {
              id: uid(),
              from: connectFrom,
              to: ent.id,
              cardinalityFrom: "one",
              cardinalityTo: "many",
              label: "relacionado"
            };
            const updatedRels = [...relationships, newRel];
            setRelationships(updatedRels);
            setConnectFrom(null);
            setToolMode("select");
            pushHistory(entities, updatedRels);
          }
          return;
        }

        setSelectedEntityId(ent.id);
        setSelectedRelId(null);

        setDragState({
          entityId: ent.id,
          startX: e.clientX,
          startY: e.clientY,
          origX: ent.x,
          origY: ent.y
        });
      };

      const exportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ entities, relationships }));
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `er_diagram_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.entities && parsed.relationships) {
                setEntities(parsed.entities);
                setRelationships(parsed.relationships);
                pushHistory(parsed.entities, parsed.relationships);
              }
            } catch (err) {
              alert("Archivo JSON inválido.");
            }
          };
        }
      };

      const startNewDiagram = () => {
        if (entities.length > 0 && !window.confirm("¿Descartar este diagrama y empezar uno nuevo?")) return;
        setForm(initialForm);
        setEntities([]);
        setRelationships([]);
        setSelectedEntityId(null);
        setSelectedRelId(null);
        setStep("setup");
      };

      const canGenerate = form.description.trim().length > 10;

      return (
        <div 
          className="flex flex-col h-screen w-screen bg-slate-950 text-slate-100 overflow-hidden font-body select-none"
          onWheel={step === "editor" ? handleWheelZoom : undefined}
        >
          {step === "setup" && (
            <div className="flex-1 overflow-y-auto">
              <div className="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-14">
                <StepIndicator index={0} />
                <h1 className="font-display text-2xl sm:text-4xl font-bold mt-4 sm:mt-6 mb-2">ER Studio</h1>
                <p className="text-slate-400 text-xs sm:text-sm mb-6 sm:mb-10 max-w-xl">
                  Generador y diseñador de diagramas entidad-relación. Elegí una plantilla o describí tu propio sistema, respondé un par de preguntas y empezá a editar.
                </p>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4">
                  {PRE_TEMPLATES.map((t) => {
                    const Icon = t.icon;
                    return (
                      <button
                        key={t.id}
                        onClick={() => pickTemplate(t)}
                        className="text-left border border-slate-800 rounded-lg p-3.5 sm:p-4 bg-slate-900 hover:border-cyan-400 transition-colors"
                      >
                        <Icon size={20} className="text-cyan-400 mb-2.5 sm:mb-3" />
                        <div className="font-display font-semibold text-sm mb-1">{t.name}</div>
                        <div className="text-xs text-slate-500 leading-relaxed">{t.blurb}</div>
                      </button>
                    );
                  })}
                  <button
                    onClick={pickCustom}
                    className="text-left border border-dashed border-slate-700 rounded-lg p-3.5 sm:p-4 bg-slate-950 hover:border-cyan-400 transition-colors"
                  >
                    <SparklesIcon size={20} className="text-cyan-400 mb-2.5 sm:mb-3" />
                    <div className="font-display font-semibold text-sm mb-1">Describir mi propio sistema</div>
                    <div className="text-xs text-slate-500 leading-relaxed">Contanos de qué se trata tu proyecto</div>
                  </button>
                </div>
              </div>
            </div>
          )}

          {step === "questionnaire" && (
            <div className="flex-1 overflow-y-auto">
              <div className="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-14">
                <StepIndicator index={1} />
                <button onClick={() => setStep("setup")} className="flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-300 mt-4 sm:mt-6 mb-4">
                  <ArrowLeft size={13} /> volver
                </button>
                <h2 className="font-display text-xl sm:text-2xl font-bold mb-4 sm:mb-6">Contanos los detalles</h2>

                <div className="flex flex-col gap-4 sm:gap-5">
                  <div>
                    <label className="text-xs uppercase tracking-wide text-slate-500 font-display">Nombre del proyecto</label>
                    <input
                      className="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-400"
                      value={form.projectName}
                      onChange={(e) => setForm({ ...form, projectName: e.target.value })}
                      placeholder="ej: Sistema de turnos"
                    />
                  </div>

                  <div>
                    <label className="text-xs uppercase tracking-wide text-slate-500 font-display">Describí el sistema en detalle</label>
                    <textarea
                      className="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-400"
                      rows={5}
                      value={form.description}
                      onChange={(e) => setForm({ ...form, description: e.target.value })}
                      placeholder="Contá qué entidades participan, qué hace cada una y cómo se relacionan entre sí..."
                    />
                  </div>

                  <div>
                    <label className="text-xs uppercase tracking-wide text-slate-500 font-display">Nivel de detalle</label>
                    <div className="mt-1.5 flex gap-2">
                      {["basico", "intermedio", "avanzado"].map((lvl) => (
                        <button
                          key={lvl}
                          onClick={() => setForm({ ...form, detailLevel: lvl })}
                          className={
                            "flex-1 py-1.5 rounded text-xs font-display capitalize border transition-colors " +
                            (form.detailLevel === lvl ? "border-cyan-400 text-cyan-400 bg-slate-900" : "border-slate-700 text-slate-400")
                          }
                        >
                          {lvl}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs uppercase tracking-wide text-slate-500 font-display">Entidades que ya tenés en mente (opcional)</label>
                    <input
                      className="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-400"
                      value={form.knownEntities}
                      onChange={(e) => setForm({ ...form, knownEntities: e.target.value })}
                      placeholder="separadas por coma, ej: Usuario, Producto, Orden"
                    />
                  </div>

                  <div>
                    <label className="text-xs uppercase tracking-wide text-slate-500 font-display">Algo que no puede faltar (opcional)</label>
                    <input
                      className="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-400"
                      value={form.mustHave}
                      onChange={(e) => setForm({ ...form, mustHave: e.target.value })}
                      placeholder="ej: manejo de roles y permisos"
                    />
                  </div>

                  <button
                    onClick={handleGenerate}
                    disabled={!canGenerate}
                    className={
                      "mt-2 flex items-center justify-center gap-2 rounded py-2.5 font-display font-semibold text-sm transition-colors " +
                      (canGenerate ? "bg-cyan-400 text-slate-950 hover:bg-cyan-300" : "bg-slate-800 text-slate-600 cursor-not-allowed")
                    }
                  >
                    <Wand2 size={16} /> Generar diagrama
                  </button>
                  {!canGenerate && <p className="text-xs text-slate-600 -mt-2">Contanos un poco más sobre el sistema (mínimo unas palabras).</p>}
                </div>
              </div>
            </div>
          )}

          {step === "loading" && (
            <div className="flex-1 flex flex-col items-center justify-center gap-4 px-4 text-center">
              <Loader2 size={32} className="text-cyan-400 animate-spin" />
              <p className="text-slate-400 text-sm font-display">Generando tu diagrama...</p>
            </div>
          )}

          {step === "editor" && (
            <>
              {/* TOOLBAR SUPERIOR DEL EDITOR EN EL ORDEN SOLICITADO */}
              <header className="no-print h-14 bg-slate-900 border-b border-slate-800 px-3 sm:px-4 flex items-center justify-between shrink-0 z-20 shadow-lg overflow-x-auto no-scrollbar whitespace-nowrap">
                <div className="flex items-center gap-3 shrink-0">
                  <div className="flex items-center gap-2">
                    <button onClick={startNewDiagram} className="text-slate-400 hover:text-slate-100 mr-1 sm:mr-2 p-1 rounded hover:bg-slate-800" title="Volver a inicio">
                      <ArrowLeft size={18} />
                    </button>
                    <SparklesIcon className="text-cyan-400" size={20} />
                    <h1 className="font-display font-bold text-sm sm:text-lg text-slate-100">
                      {form.projectName || "ER Studio"} <span className="text-[10px] sm:text-xs text-cyan-400 font-normal px-1.5 py-0.5 rounded bg-cyan-950 border border-cyan-800/50">v3.0</span>
                    </h1>
                  </div>
                </div>

                {/* Controles Principales Reordenados */}
                <div className="flex items-center gap-1.5 sm:gap-2 shrink-0 pl-3">
                  
                  {/* 1. Zoom (con etiqueta Zoom + porcentaje e íconos) */}
                  <div className="flex items-center bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 gap-1">
                    <span className="text-[11px] font-display font-semibold text-slate-400 mr-1">Zoom</span>
                    <button onClick={() => setZoom((z) => Math.max(0.4, z - 0.1))} className="p-0.5 text-slate-400 hover:text-slate-100" title="Alejar">
                      <ZoomOutIcon size={14} />
                    </button>
                    <span className="text-[10px] font-mono text-slate-300 min-w-[32px] text-center">{Math.round(zoom * 100)}%</span>
                    <button onClick={() => setZoom((z) => Math.min(2.0, z + 0.1))} className="p-0.5 text-slate-400 hover:text-slate-100" title="Acercar">
                      <ZoomInIcon size={14} />
                    </button>
                  </div>

                  {/* 2. Undo / Redo (Volver para atrás o delante) */}
                  <div className="flex items-center gap-1">
                    <button
                      disabled={historyIdx <= 0}
                      onClick={undo}
                      className="p-1.5 text-slate-400 hover:text-slate-100 disabled:opacity-30 rounded bg-slate-950 border border-slate-800"
                      title="Deshacer"
                    >
                      <UndoIcon size={14} />
                    </button>
                    <button
                      disabled={historyIdx >= history.length - 1}
                      onClick={redo}
                      className="p-1.5 text-slate-400 hover:text-slate-100 disabled:opacity-30 rounded bg-slate-950 border border-slate-800"
                      title="Rehacer"
                    >
                      <RedoIcon size={14} />
                    </button>
                  </div>

                  <div className="h-4 w-px bg-slate-800 my-auto" />

                  {/* 3. + Tabla */}
                  <button
                    onClick={createNewEntity}
                    className="flex items-center gap-1.5 text-xs bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition-colors shadow-md shadow-cyan-500/10"
                  >
                    <PlusIcon size={15} /> Tabla
                  </button>

                  {/* 4. Agregar flecha */}
                  <button
                    onClick={() => {
                      setToolMode(toolMode === "connect" ? "select" : "connect");
                      setConnectFrom(null);
                    }}
                    className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg font-semibold border transition-all ${toolMode === "connect" ? "bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20" : "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700"}`}
                  >
                    <LinkIcon size={15} /> {toolMode === "connect" ? "Seleccioná Destino..." : "Agregar flecha"}
                  </button>

                  {/* 5. Controles complementarios */}
                  <button
                    onClick={() => setToolMode(toolMode === "pan" ? "select" : "pan")}
                    className={`p-1.5 rounded-lg border transition-all ${toolMode === "pan" ? "bg-cyan-500 text-slate-950 border-cyan-400" : "bg-slate-800 text-slate-300 border-slate-700"}`}
                    title="Modo Panorámico (Mover Lienzo)"
                  >
                    <MoveIcon size={16} />
                  </button>

                  <div className="h-4 w-px bg-slate-800 my-auto" />

                  <button
                    onClick={() => setShowSqlModal(true)}
                    className="flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-cyan-300 font-mono font-semibold px-2.5 py-1.5 rounded-lg border border-slate-700"
                    title="Ver Script SQL DDL"
                  >
                    <CodeIcon size={15} /> SQL
                  </button>

                  <button
                    onClick={exportJSON}
                    className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700"
                    title="Guardar como JSON"
                  >
                    <DownloadIcon size={15} />
                  </button>

                  <label className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 cursor-pointer" title="Cargar JSON">
                    <UploadIcon size={15} />
                    <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                  </label>
                </div>
              </header>

              {/* LIENZO + PANEL LATERAL EXACTAMENTE COMO TU CÓDIGO ORIGINAL */}
              <div className="flex-1 flex flex-col md:flex-row overflow-hidden relative">
                {/* CANVAS INTERACTIVO */}
                <div
                  className={`flex-1 bg-slate-950 relative overflow-hidden touch-canvas ${toolMode === "pan" || isPanning ? "cursor-grab active:cursor-grabbing" : "cursor-crosshair"}`}
                  onPointerDown={handlePointerDownCanvas}
                  onPointerMove={handlePointerMoveCanvas}
                  onPointerUp={handlePointerUpCanvas}
                >
                  <svg
                    ref={svgRef}
                    className="w-full h-full"
                    style={{
                      transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
                      transformOrigin: "0 0"
                    }}
                  >
                    <defs>
                      <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" strokeWidth="0.5" />
                      </pattern>
                    </defs>
                    <rect width="10000" height="10000" x="-5000" y="-5000" fill="url(#grid)" />

                    {/* RELACIONES / DIBUJO DE LÍNEAS TIPO BÉZIER CONECTORAS */}
                    <g>
                      {relationships.map((rel) => {
                        const fromEnt = getEntity(rel.from);
                        const toEnt = getEntity(rel.to);
                        if (!fromEnt || !toEnt) return null;

                        const { p1, p2, dx, dy } = getBestAnchor(fromEnt, toEnt);
                        const isSelected = rel.id === selectedRelId;

                        const ctrlX1 = p1.x + (Math.abs(dx) > Math.abs(dy) ? (p2.x > p1.x ? 60 : -60) : 0);
                        const ctrlY1 = p1.y + (Math.abs(dy) >= Math.abs(dx) ? (p2.y > p1.y ? 60 : -60) : 0);
                        const ctrlX2 = p2.x + (Math.abs(dx) > Math.abs(dy) ? (p2.x > p1.x ? -60 : 60) : 0);
                        const ctrlY2 = p2.y + (Math.abs(dy) >= Math.abs(dx) ? (p2.y > p1.y ? -60 : 60) : 0);

                        const pathData = `M ${p1.x} ${p1.y} C ${ctrlX1} ${ctrlY1}, ${ctrlX2} ${ctrlY2}, ${p2.x} ${p2.y}`;

                        return (
                          <g
                            key={rel.id}
                            onClick={(e) => {
                              e.stopPropagation();
                              setSelectedRelId(rel.id);
                              setSelectedEntityId(null);
                            }}
                            className="cursor-pointer group"
                          >
                            <path
                              d={pathData}
                              fill="none"
                              stroke={isSelected ? "#38bdf8" : "#475569"}
                              strokeWidth={isSelected ? 3 : 2}
                              strokeDasharray={rel.cardinalityFrom === "many" || rel.cardinalityTo === "many" ? "6,4" : "none"}
                            />
                            <g transform={`translate(${(p1.x + p2.x) / 2}, ${(p1.y + p2.y) / 2})`}>
                              <rect
                                x="-40"
                                y="-12"
                                width="80"
                                height="24"
                                rx="12"
                                fill="#090d16"
                                stroke={isSelected ? "#38bdf8" : "#334155"}
                                strokeWidth="1"
                              />
                              <text
                                x="0"
                                y="4"
                                textAnchor="middle"
                                fill="#94a3b8"
                                fontSize="10"
                                className="font-display font-medium"
                              >
                                {rel.label || "relación"}
                              </text>
                            </g>
                          </g>
                        );
                      })}
                    </g>

                    {/* ENTIDADES / TARJETAS DE TABLAS */}
                    <g>
                      {entities.map((ent) => {
                        const h = cardHeight(ent.attributes.length);
                        const isSelected = ent.id === selectedEntityId;
                        const isConnectSrc = ent.id === connectFrom;
                        const theme = COLOR_THEMES[ent.color] || COLOR_THEMES.cyan;

                        return (
                          <g
                            key={ent.id}
                            transform={`translate(${ent.x},${ent.y})`}
                            onPointerDown={(e) => handleEntityPointerDown(e, ent)}
                            onDoubleClick={(e) => {
                              e.stopPropagation();
                              setEditingEntityModalId(ent.id);
                            }}
                          >
                            <rect
                              width={CARD_W}
                              height={h}
                              rx="12"
                              fill="#090d16"
                              stroke={isConnectSrc ? "#f59e0b" : isSelected ? theme.badge : "#1e293b"}
                              strokeWidth={isSelected || isConnectSrc ? 2.5 : 1.5}
                              className="transition-shadow"
                            />

                            <path
                              d={`M 0 12 Q 0 0 12 0 L ${CARD_W - 12} 0 Q ${CARD_W} 0 ${CARD_W} 12 L ${CARD_W} ${HEADER_H} L 0 ${HEADER_H} Z`}
                              fill={isSelected ? "#1e293b" : "#0f172a"}
                            />

                            <rect x="0" y={HEADER_H - 2} width={CARD_W} height="2" fill={theme.badge} opacity="0.8" />

                            <text x="14" y="25" fontSize="13" fontWeight="700" fill="#f8fafc" className="font-mono">
                              {ent.name}
                            </text>

                            {isSelected && toolMode !== "connect" && (
                              <g
                                transform={`translate(${CARD_W - 65}, 8)`}
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setEditingEntityModalId(ent.id);
                                }}
                                className="cursor-pointer"
                              >
                                <rect width="55" height="22" rx="6" fill="#0284c7" />
                                <text x="27" y="15" fontSize="10" fontWeight="700" fill="#ffffff" textAnchor="middle" className="font-display">
                                  ✏️ Editar
                                </text>
                              </g>
                            )}

                            {ent.attributes.map((attr, i) => (
                              <g key={attr.id} transform={`translate(14, ${HEADER_H + 20 + i * ROW_H})`}>
                                {attr.pk && <text x="0" y="0" fontSize="10" fill="#f59e0b" fontWeight="bold">🔑</text>}
                                {attr.fk && !attr.pk && <text x="0" y="0" fontSize="10" fill="#38bdf8" fontWeight="bold">🔗</text>}

                                <text
                                  x={attr.pk || attr.fk ? "18" : "0"}
                                  y="0"
                                  fontSize="11"
                                  fill={attr.pk ? "#fbbf24" : "#e2e8f0"}
                                  className="font-mono"
                                  fontWeight={attr.pk ? "700" : "400"}
                                >
                                  {attr.name}
                                </text>

                                <text x={CARD_W - 28} y="0" textAnchor="end" fontSize="10" fill="#64748b" className="font-mono">
                                  {attr.type}
                                </text>
                              </g>
                            ))}
                          </g>
                        );
                      })}
                    </g>
                  </svg>
                </div>

                {/* PANEL LATERAL DE INSPECCIÓN EXACTAMENTE AL TAMAÑO DE TU CÓDIGO ORIGINAL */}
                <aside className="no-print w-full md:w-80 shrink-0 border-t md:border-t-0 md:border-l border-slate-800 bg-slate-900 p-4 overflow-y-auto max-h-64 sm:max-h-80 md:max-h-full">
                  {selectedEntity ? (
                    <div className="flex flex-col gap-4">
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <label className="text-xs uppercase tracking-wide text-slate-400 font-display font-semibold">Tabla Seleccionada</label>
                          <button
                            onClick={() => setEditingEntityModalId(selectedEntity.id)}
                            className="flex items-center gap-1 text-xs text-cyan-400 hover:text-cyan-300 font-semibold bg-cyan-950/50 px-2.5 py-1 rounded-lg border border-cyan-800/50"
                          >
                            <EditIcon size={13} /> Abrir Editor
                          </button>
                        </div>
                        <input
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-mono font-bold focus:outline-none focus:border-cyan-400"
                          value={selectedEntity.name}
                          onChange={(e) => updateEntity(selectedEntity.id, { name: e.target.value.toLowerCase().replace(/\s+/g, "_") })}
                        />
                      </div>

                      <div>
                        <label className="text-xs uppercase tracking-wide text-slate-400 font-display font-semibold mb-2 block">
                          Atributos ({selectedEntity.attributes.length})
                        </label>
                        <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                          {selectedEntity.attributes.map((attr) => (
                            <div key={attr.id} className="text-xs p-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-between font-mono">
                              <span className={attr.pk ? "text-amber-400 font-bold" : "text-slate-200"}>
                                {attr.pk ? "🔑 " : attr.fk ? "🔗 " : ""}{attr.name}
                              </span>
                              <span className="text-slate-500 text-[10px]">{attr.type}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <button
                        onClick={() => deleteEntity(selectedEntity.id)}
                        className="mt-2 flex items-center justify-center gap-2 text-xs text-red-400 border border-red-900/60 rounded-lg py-2 hover:bg-red-950/40 transition-colors"
                      >
                        <TrashIcon size={14} /> Eliminar esta entidad
                      </button>
                    </div>
                  ) : selectedRel ? (
                    <div className="flex flex-col gap-4">
                      <label className="text-xs uppercase tracking-wide text-slate-400 font-display font-semibold">Relación Seleccionada</label>
                      <div className="border border-slate-800 rounded-xl p-3 bg-slate-950 flex flex-col gap-3">
                        <div>
                          <div className="text-xs text-slate-400 mb-1">Etiqueta:</div>
                          <input
                            className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-100 font-display"
                            value={selectedRel.label || ""}
                            onChange={(e) => {
                              const updated = relationships.map((r) => (r.id === selectedRel.id ? { ...r, label: e.target.value } : r));
                              setRelationships(updated);
                            }}
                          />
                        </div>
                      </div>
                      <button
                        onClick={() => {
                          const updated = relationships.filter((r) => r.id !== selectedRel.id);
                          setRelationships(updated);
                          setSelectedRelId(null);
                        }}
                        className="flex items-center justify-center gap-2 text-xs text-red-400 border border-red-900/60 rounded-lg py-2 hover:bg-red-950/40 transition-colors"
                      >
                        <TrashIcon size={14} /> Eliminar relación
                      </button>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-4 text-xs text-slate-400">
                      <div className="border-b border-slate-800 pb-3">
                        <h2 className="font-display font-bold text-sm text-slate-200 mb-1">Diagrama Entidad-Relación</h2>
                        <p>{entities.length} tablas · {relationships.length} relaciones</p>
                      </div>

                      <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                        <h3 className="font-display font-semibold text-slate-300 text-xs">💡 Controles de Lienzo</h3>
                        <ul className="space-y-1.5 text-slate-400 text-[11px]">
                          <li>• <strong>Arrastrar Lienzo</strong>: Modo Mover (<MoveIcon size={12} className="inline" />) o clic central / espacio.</li>
                          <li>• <strong>Zoom</strong>: Rueda del ratón + Ctrl.</li>
                          <li>• <strong>Doble Clic</strong> en tabla para editar todos los campos SQL.</li>
                          <li>• <strong>SQL</strong>: Generá script de base de datos listo.</li>
                        </ul>
                      </div>
                    </div>
                  )}
                </aside>
              </div>

              {/* MODAL EDITAR ENTIDAD */}
              {editingEntityModalId && (
                <EntityEditModal
                  entity={modalEntity}
                  onClose={() => setEditingEntityModalId(null)}
                  onUpdateEntity={updateEntity}
                  onAddAttr={addAttribute}
                  onDeleteAttr={deleteAttribute}
                  onUpdateAttr={updateAttribute}
                  onMoveAttr={moveAttribute}
                />
              )}

              {/* MODAL GENERADOR SQL */}
              {showSqlModal && (
                <SqlExportModal
                  entities={entities}
                  relationships={relationships}
                  onClose={() => setShowSqlModal(false)}
                />
              )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ERDiagramStudio />);
  </script>
</body>
</html>
