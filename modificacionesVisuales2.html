    function layoutEntities(list) {

      return list.map((e, i) => ({

        y: 60 + Math.floor(i / cols) * cellH,
      }));

    // Calcula el punto de anclaje óptimo en el borde de un elemento rectangular
    function getBestAnchor(source, target) {
      const hSource = cardHeight(source.attributes.length);
      const hTarget = cardHeight(target.attributes.length);

      const c1 = { x: source.x + CARD_W / 2, y: source.y + hSource / 2 };
      const c2 = { x: target.x + CARD_W / 2, y: target.y + hTarget / 2 };

      const dx = c2.x - c1.x;
      const dy = c2.y - c1.y;

      let p1 = { ...c1 }, p2 = { ...c2 };

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) {
          p1 = { x: source.x + CARD_W, y: c1.y };
          p2 = { x: target.x, y: c2.y };
        } else {
          p1 = { x: source.x, y: c1.y };
          p2 = { x: target.x + CARD_W, y: c2.y };
        }
      } else {
        if (dy > 0) {
          p1 = { x: c1.x, y: source.y + hSource };
          p2 = { x: c2.x, y: target.y };
        } else {
          p1 = { x: c1.x, y: source.y };
          p2 = { x: c2.x, y: target.y + hTarget };
        }
      }

      return { p1, p2, dx, dy };
    }

    function SqlExportModal({ entities, relationships, onClose }) {
      const [dialect, setDialect] = useState("postgresql");
      const [copied, setCopied] = useState(false);

      const sqlCode = useMemo(() => {
        let code = `-- Generado automáticamente por ER Studio\n-- Dialecto: ${dialect.toUpperCase()}\n\n`;

        entities.forEach((ent) => {
          code += `CREATE TABLE ${ent.name} (\n`;
          const lines = [];
          const pkFields = [];

          const addedColNames = new Set();
          ent.attributes.forEach((attr) => {
            let line = `  ${attr.name} ${attr.type}`;
            if (!attr.isNull && !attr.pk) line += " NOT NULL";
            if (attr.isUnique && !attr.pk) line += " UNIQUE";
            lines.push(line);
            addedColNames.add(attr.name);
            if (attr.pk) pkFields.push(attr.name);
          });

          relationships.forEach((rel) => {
            if (rel.to === ent.id) {
              const fromEnt = entities.find((e) => e.id === rel.from);
              if (fromEnt) {
                const fkColName = `${fromEnt.name}_id`;
                if (!addedColNames.has(fkColName)) {
                  const pkAttr = fromEnt.attributes.find((a) => a.pk) || { type: "INT" };
                  lines.push(`  ${fkColName} ${pkAttr.type}`);
                  addedColNames.add(fkColName);
                }
              }
            }
          });

          if (pkFields.length > 0) {
            lines.push(`  PRIMARY KEY (${pkFields.join(", ")})`);
          }

          code += lines.join(",\n");
          code += `\n);\n\n`;
        });

        relationships.forEach((rel) => {
          const fromEnt = entities.find((e) => e.id === rel.from);
          const toEnt = entities.find((e) => e.id === rel.to);
          if (fromEnt && toEnt) {
            const fkColName = `${fromEnt.name}_id`;
            const pkAttr = fromEnt.attributes.find((a) => a.pk) || { name: "id" };
            code += `-- Relación: ${fromEnt.name} -> ${toEnt.name}\n`;
            code += `ALTER TABLE ${toEnt.name} ADD CONSTRAINT fk_${toEnt.name}_${fromEnt.name}\n`;
            code += `  FOREIGN KEY (${fkColName}) REFERENCES ${fromEnt.name}(${pkAttr.name});\n\n`;
          }
        });

        return code;
      }, [entities, relationships, dialect]);

      const handleCopy = () => {
        if (dialect === "vectorial") return;
        
        // Creamos un textarea temporal oculto para usar execCommand('copy')
        const textArea = document.createElement("textarea");
        textArea.value = sqlCode;
        textArea.style.position = "fixed"; // Lo fijamos para que no mueva la pantalla
        textArea.style.left = "-9999px";   // Lo escondemos fuera de la vista
        
        document.body.appendChild(textArea);
        textArea.select();
        
        try {
          document.execCommand("copy");
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (err) {
          console.error("Error al copiar al portapapeles: ", err);
        }
        
        document.body.removeChild(textArea); // Limpiamos el elemento
      };

      const dialects = [
        { id: "postgresql", label: "postgresql" },
        { id: "mysql", label: "mysql" },
        { id: "sqlite", label: "sqlite" },
        { id: "vectorial", label: "base de dato vectorial" }
      ];

      return (
        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">

                <span className="text-xs text-slate-400 font-display shrink-0">SGBD:</span>
                <div className="flex items-center gap-2">
                  {dialects.map((d) => (
                    <button
                      key={d.id}
                      onClick={() => setDialect(d.id)}
                      className={`text-xs px-3 py-1.5 rounded-lg font-mono whitespace-nowrap border transition-colors ${dialect === d.id ? "bg-cyan-500/20 text-cyan-300 border-cyan-500/50" : "bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-600"}`}
                    >
                      {d.label}
                    </button>
                  ))}
                </div>
              </div>

              <button
                onClick={handleCopy}
                disabled={dialect === "vectorial"}
                className={`flex items-center justify-center gap-1.5 text-xs font-bold px-4 py-2 sm:px-3 sm:py-1.5 rounded-lg transition-colors shrink-0 ${dialect === "vectorial" ? "bg-slate-800 text-slate-600 cursor-not-allowed" : "bg-cyan-500 text-slate-950 hover:bg-cyan-400"}`}
              >
                {copied ? <CheckIcon size={14} /> : <CodeIcon size={14} />}
                {copied ? "¡Copiado!" : "Copiar SQL"}
              </button>
            </div>

            <div className="p-4 overflow-y-auto flex-1 font-mono text-xs bg-slate-950 leading-relaxed select-all flex flex-col">
              {dialect === "vectorial" ? (
                <div className="flex-1 flex flex-col items-center justify-center text-slate-400 font-display text-center gap-2 h-full py-10">
                  <p className="text-lg font-bold text-cyan-400">Opción premium para más adelante</p>
                  <p className="text-xs max-w-sm">¡Pronto podrás exportar tu modelo directamente a bases de datos vectoriales impulsadas por Inteligencia Artificial!</p>
                </div>
              ) : (
                <div className="text-cyan-200 whitespace-pre">
                  {sqlCode}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Componente Principal y Flujo                                       */
    /* ------------------------------------------------------------------ */
    const initialForm = {
      templateId: null,
      projectName: "",
      description: "",
      detailLevel: "avanzado",
    };

    function ERDiagramStudio() {
      const [step, setStep] = useState("setup"); // 'setup' | 'questionnaire' | 'loading' | 'editor'
      const [form, setForm] = useState(initialForm);

      // Estado del editor
      const [entities, setEntities] = useState([]);
      const [relationships, setRelationships] = useState([]);
      const [selectedEntityId, setSelectedEntityId] = useState(null);
      const [selectedRelId, setSelectedRelId] = useState(null);
      
      const [toolMode, setToolMode] = useState("select"); // 'select' | 'connect'
      const [connectFrom, setConnectFrom] = useState(null);
      const [editingEntityModalId, setEditingEntityModalId] = useState(null);
      const [showSqlModal, setShowSqlModal] = useState(false);
      const [showConfirmModal, setShowConfirmModal] = useState(false); // NUEVO ESTADO PARA EL MODAL DE CONFIRMACIÓN
      
      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isPanning, setIsPanning] = useState(false);
      const [panStart, setPanStart] = useState({ x: 0, y: 0 });
      const [dragState, setDragState] = useState(null);
      const [snapToGrid, setSnapToGrid] = useState(true);

      const [history, setHistory] = useState([]);
      const [historyIdx, setHistoryIdx] = useState(-1);

      const svgRef = useRef(null);
      const canvasRef = useRef(null); // NUEVO: Referencia para el contenedor del canvas

      // Evitar que Ctrl+S abra el cuadro de diálogo para guardar de Windows/Mac
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
            e.preventDefault(); // Mantiene todos los cambios ya guardados localmente
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // CONTROL DE HISTORIAL DEL NAVEGADOR
      useEffect(() => {
        if (!window.history.state || !window.history.state.step) {
          window.history.replaceState({ step: "setup" }, "", window.location.href);
        }
      }, []);

      useEffect(() => {
        const handlePopState = (e) => {
          const targetStep = e.state?.step || "setup";
          
          if (step === "editor" && targetStep !== "editor") {
            if (entities.length > 0) {
              // Si el usuario intentó salir del editor, cancelamos esa acción volviendo a empujar 'editor' al historial
              window.history.pushState({ step: "editor" }, "", window.location.href);
              setShowConfirmModal(true);
            } else {
              setStep(targetStep);
            }
          } else {
            setStep(targetStep);
          }
        };

        window.addEventListener("popstate", handlePopState);
        return () => window.removeEventListener("popstate", handlePopState);
      }, [step, entities.length]);

      // Función para navegar y registrar en el historial
      const navigateTo = (newStep) => {
        window.history.pushState({ step: newStep }, "", window.location.href);
        setStep(newStep);
      };

      const pushHistory = useCallback((newEntities, newRels) => {
        const nextState = { entities: newEntities, rels: newRels };
        setHistory((prev) => [...prev.slice(0, historyIdx + 1), nextState]);
        setHistoryIdx((prev) => prev + 1);
      }, [historyIdx]);

      const undo = () => {
        if (historyIdx > 0) {
          const prev = history[historyIdx - 1];
          setEntities(prev.entities);
          setRelationships(prev.rels);
          setHistoryIdx(historyIdx - 1);
        }
      };

      const redo = () => {
        if (historyIdx < history.length - 1) {
          const next = history[historyIdx + 1];
          setEntities(next.entities);
          setRelationships(next.rels);
          setHistoryIdx(historyIdx + 1);
        }
      };

      function pickTemplate(t) {
        setForm({ ...initialForm, templateId: t.id, projectName: t.name, description: t.description });
        navigateTo("questionnaire");
      }

      function pickCustom() {
        setForm({ ...initialForm, templateId: "custom", projectName: "Mi Proyecto Nuevo", description: "" });
        setStep("loading");
        setTimeout(() => {
          const basicEntities = [
            {
              name: "usuarios",
              color: "cyan",
              attributes: [
                { name: "id", type: "INT", pk: true, isNull: false, isUnique: true },
                { name: "nombre", type: "VARCHAR(100)", isNull: false },
                { name: "email", type: "VARCHAR(150)", isNull: false, isUnique: true },
                { name: "fecha_creacion", type: "TIMESTAMP", isNull: false }
              ]
            }
          ];
          loadDiagram(basicEntities, []);
          navigateTo("editor");
        }, 300);
      }

      function loadDiagram(rawEntities, rawRelationships) {
        const nameToId = {};
        const newEntities = (rawEntities || []).map((e) => {
          const id = uid();
          nameToId[e.name] = id;
          return {
            id,
            name: e.name,
            color: e.color,
            x: 0,
            y: 0,
            attributes: (e.attributes || []).map((a) => ({
              id: uid(),
              name: a.name,
              type: a.type || "VARCHAR(100)",
              pk: !!a.pk,
              fk: !!a.fk,
              isNull: a.isNull !== undefined ? a.isNull : !a.pk,
              isUnique: !!a.isUnique || !!a.pk,
            })),
          };
        });

        const laidOut = layoutEntities(newEntities);
        const newRels = (rawRelationships || [])
          .map((r) => {
            const fromId = nameToId[r.from];
            const toId = nameToId[r.to];
            if (!fromId || !toId) return null;
            return {
              id: uid(),
              from: fromId,
              to: toId,
              cardinalityFrom: r.cardinalityFrom === "many" ? "many" : "one",
              cardinalityTo: r.cardinalityTo === "many" ? "many" : "one",
              label: r.label || "",
            };
          })
          .filter(Boolean);

        setEntities(laidOut);
        setRelationships(newRels);
        setSelectedEntityId(null);
        setSelectedRelId(null);
        setZoom(window.innerWidth < 768 ? 0.55 : 1);
        setPan({ x: 0, y: 0 });
        setHistory([{ entities: laidOut, rels: newRels }]);
        setHistoryIdx(0);
      }

      function handleGenerate() {
        setStep("loading");
        setTimeout(() => {
          const fb = buildFallback(form);
          loadDiagram(fb.entities, fb.relationships);
          navigateTo("editor");
        }, 300);
      }

      const getEntity = (id) => entities.find((e) => e.id === id);
      const selectedEntity = getEntity(selectedEntityId);
      const modalEntity = getEntity(editingEntityModalId);
      const selectedRel = relationships.find((r) => r.id === selectedRelId);

      const updateEntity = (id, patch) => {
        const updated = entities.map((e) => (e.id === id ? { ...e, ...patch } : e));
        setEntities(updated);
      };

      const deleteEntity = (id) => {
        const updatedEnts = entities.filter((e) => e.id !== id);
        const updatedRels = relationships.filter((r) => r.from !== id && r.to !== id);
        setEntities(updatedEnts);
        setRelationships(updatedRels);
        setSelectedEntityId(null);
        if (editingEntityModalId === id) setEditingEntityModalId(null);
        pushHistory(updatedEnts, updatedRels);
      };

      const addAttribute = (entId, customDefaults = {}) => {
        const updated = entities.map((e) => {
          if (e.id !== entId) return e;
          return {
            ...e,
            attributes: [
              ...e.attributes,
              {
                id: uid(),
                name: customDefaults.name || `campo_${e.attributes.length + 1}`,
                type: customDefaults.type || "VARCHAR(100)",
                pk: false,
                fk: false,
                isNull: true,
                isUnique: false
              }
            ]
          };
        });
        setEntities(updated);
        pushHistory(updated, relationships);
      };

      const updateAttribute = (entId, attrId, patch) => {
        const updated = entities.map((e) => {
          if (e.id !== entId) return e;
          return {
            ...e,
            attributes: e.attributes.map((a) => (a.id === attrId ? { ...a, ...patch } : a))
          };
        });
        setEntities(updated);
      };

      const deleteAttribute = (entId, attrId) => {
        const updated = entities.map((e) => {
          if (e.id !== entId) return e;
          return {
            ...e,
            attributes: e.attributes.filter((a) => a.id !== attrId)
          };
        });
        setEntities(updated);
        pushHistory(updated, relationships);
      };

      const moveAttribute = (entId, index, direction) => {
        const updated = entities.map((e) => {
          if (e.id !== entId) return e;
          const newAttrs = [...e.attributes];
          const targetIdx = index + direction;
          if (targetIdx < 0 || targetIdx >= newAttrs.length) return e;
          const temp = newAttrs[index];
          newAttrs[index] = newAttrs[targetIdx];
          newAttrs[targetIdx] = temp;
          return { ...e, attributes: newAttrs };
        });
        setEntities(updated);
      };

      const createNewEntity = () => {
        const newId = uid();
        const colors = Object.keys(COLOR_THEMES);
        const newEntity = {
          id: newId,
          name: `tabla_${entities.length + 1}`,
          color: colors[entities.length % colors.length],
          x: Math.round((-pan.x + 200 + (entities.length % 3) * 40) / 15) * 15,
          y: Math.round((-pan.y + 150 + (entities.length % 3) * 40) / 15) * 15,
          attributes: [
            { id: uid(), name: "id", type: "INT", pk: true, fk: false, isNull: false, isUnique: true },
            { id: uid(), name: "nombre", type: "VARCHAR(100)", pk: false, fk: false, isNull: false }
          ]
        };
        const updatedEnts = [...entities, newEntity];
        setEntities(updatedEnts);
        setSelectedEntityId(newId);
        setEditingEntityModalId(newId);
        pushHistory(updatedEnts, relationships);
      };

      const handlePointerDownCanvas = (e) => {
        // Se quitó el modo "pan" del click izquierdo, solo funciona con rueda del ratón o espaciadora
        if (e.button === 1 || e.spaceKey) {
          setIsPanning(true);
          setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
          return;
        }
        setSelectedEntityId(null);
        setSelectedRelId(null);
      };

      const handlePointerMoveCanvas = (e) => {
        if (isPanning) {
          setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
          return;
        }

        if (dragState) {
          let rawX = dragState.origX + (e.clientX - dragState.startX) / zoom;
          let rawY = dragState.origY + (e.clientY - dragState.startY) / zoom;

          if (snapToGrid) {
            rawX = Math.round(rawX / 15) * 15;
            rawY = Math.round(rawY / 15) * 15;
          }

          updateEntity(dragState.entityId, { x: Math.max(0, rawX), y: Math.max(0, rawY) });
        }
      };

      const handlePointerUpCanvas = () => {
        if (isPanning) setIsPanning(false);
        if (dragState) {
          setDragState(null);
          pushHistory(entities, relationships);
        }
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const handleWheel = (e) => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault(); 
            const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
            setZoom((z) => Math.min(2.2, Math.max(0.4, z * zoomFactor)));
          }
        };

        canvas.addEventListener("wheel", handleWheel, { passive: false });
        
        return () => {
          canvas.removeEventListener("wheel", handleWheel);
        };
      }, []);

      const handleEntityPointerDown = (e, ent) => {
        e.stopPropagation();
        if (toolMode === "connect") {
          if (!connectFrom) {
            setConnectFrom(ent.id);
          } else if (connectFrom !== ent.id) {
            const newRel = {
              id: uid(),
              from: connectFrom,
              to: ent.id,
              cardinalityFrom: "one",
              cardinalityTo: "many",
              label: "relacionado"
            };
            const updatedRels = [...relationships, newRel];
            setRelationships(updatedRels);
            setConnectFrom(null);
            setToolMode("select");
            pushHistory(entities, updatedRels);
          }
          return;
        }

        setSelectedEntityId(ent.id);
        setSelectedRelId(null);

        setDragState({
          entityId: ent.id,
          startX: e.clientX,
          startY: e.clientY,
          origX: ent.x,
          origY: ent.y
        });
      };

      const exportPNG = () => {
        const svgEl = svgRef.current;
        if (!svgEl) return;
        
        let maxRight = 1200;
        let maxBottom = 800;
        entities.forEach((ent) => {
          const right = ent.x + CARD_W + 100;
          const bottom = ent.y + cardHeight(ent.attributes.length) + 100;
          if (right > maxRight) maxRight = right;
          if (bottom > maxBottom) maxBottom = bottom;
        });

        const clone = svgEl.cloneNode(true);
        clone.setAttribute("width", maxRight);
        clone.setAttribute("height", maxBottom);
        clone.setAttribute("viewBox", `0 0 ${maxRight} ${maxBottom}`);
        
        const gMain = clone.querySelector("#diagram-group");
        if (gMain) {
          gMain.setAttribute("transform", "translate(0, 0) scale(1)");
        }

        const svgString = new XMLSerializer().serializeToString(clone);
        const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const scaleFactor = 2;
          const canvas = document.createElement("canvas");
          canvas.width = maxRight * scaleFactor;
          canvas.height = maxBottom * scaleFactor;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#030712";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.scale(scaleFactor, scaleFactor);
          ctx.drawImage(img, 0, 0, maxRight, maxBottom);
          URL.revokeObjectURL(url);
          canvas.toBlob((pngBlob) => {
            const link = document.createElement("a");
            link.download = (form.projectName || "diagrama-er").replace(/\s+/g, "-").toLowerCase() + ".png";
            link.href = URL.createObjectURL(pngBlob);
            link.click();
          }, "image/png");
        };
        img.src = url;
      };

      const startNewDiagram = () => {
        if (entities.length > 0) {
          setShowConfirmModal(true);
        } else {
          confirmStartNewDiagram();
        }
      };

      const confirmStartNewDiagram = () => {
        setShowConfirmModal(false);
        setForm(initialForm);
        setEntities([]);
        setRelationships([]);
        setSelectedEntityId(null);
        setSelectedRelId(null);
        navigateTo("setup");
      };

      const canGenerate = form.description.trim().length > 10;

      return (
        <div className="flex flex-col h-screen w-screen bg-slate-950 text-slate-100 overflow-hidden font-body select-none">
          {step === "setup" && (
            <div className="flex-1 overflow-y-auto bg-[#fafafa] text-slate-900">
              <div className="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-14">
                <StepIndicator index={0} />
                <h1 className="font-display text-2xl sm:text-4xl font-bold mt-4 sm:mt-6 mb-2">ER Studio</h1>
                <p className="text-slate-500 text-xs sm:text-sm mb-6 sm:mb-10 max-w-xl">
                 ¿Tenés un proyecto, idea o un trabajo práctico? con esta herramienta podras elegir plantillas para tus diagramas entidad-relacion y editarlas o crearlas a tu gusto.
                </p>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4">
                  {PRE_TEMPLATES.map((t) => {
                    const Icon = t.icon;
                    return (
                      <button
                        key={t.id}
                        onClick={() => pickTemplate(t)}
                        className="text-left border border-slate-900 rounded-lg p-3.5 sm:p-4 bg-white hover:bg-slate-50 hover:shadow-md transition-all"
                      >
                        <Icon size={20} className="text-slate-900 mb-2.5 sm:mb-3" />
                        <div className="font-display font-semibold text-sm mb-1">{t.name}</div>
                        <div className="text-xs text-slate-500 leading-relaxed">{t.blurb}</div>
                      </button>
                    );
                  })}
                  <button
                    onClick={pickCustom}
                    className="text-left border border-dashed border-slate-900 rounded-lg p-3.5 sm:p-4 bg-[#f0f0f0] hover:bg-[#e5e5e5] hover:shadow-md transition-all"
                  >
                    <SparklesIcon size={20} className="text-slate-900 mb-2.5 sm:mb-3" />
                    <div className="font-display font-semibold text-sm mb-1">Mi propio proyecto o trabajo practico</div>
                    <div className="text-xs text-slate-500 leading-relaxed">podes crear y ediatr lo que necesites</div>
                  </button>
                </div>
              </div>
            </div>
          )}

          {step === "questionnaire" && (
            <div className="flex-1 overflow-y-auto bg-[#fafafa] text-slate-900">
              <div className="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-14">
                <StepIndicator index={1} />
                <button onClick={() => window.history.back()} className="flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-900 mt-4 sm:mt-6 mb-4 transition-colors">
                  <ArrowLeft size={13} /> volver
                </button>
                <h2 className="font-display text-xl sm:text-2xl font-bold mb-4 sm:mb-6">
                  {form.templateId ? "Explicación de lo que se generará:" : "Contanos los detalles"}
                </h2>

                <div className="flex flex-col gap-4 sm:gap-5">
                  <div>
                    <label htmlFor="projectName" className="text-xs uppercase tracking-wide text-slate-500 font-display font-semibold">Nombre del proyecto</label>
                    <input
                      id="projectName"
                      name="projectName"
                      className="mt-1.5 w-full bg-white border border-slate-300 rounded px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-slate-900 shadow-sm transition-colors"
                      value={form.projectName}
                      onChange={(e) => setForm({ ...form, projectName: e.target.value })}
                      placeholder="ej: Sistema de turnos"
                    />
                  </div>

                  <div>
                    <label htmlFor="projectDescription" className="text-xs uppercase tracking-wide text-slate-500 font-display font-semibold">
                      {form.templateId ? "No te preocupes, luego podrás editar absolutamente todo." : "Describí el sistema en detalle"}
                    </label>
                    <textarea
                      id="projectDescription"
                      name="projectDescription"
                      className={`mt-1.5 w-full bg-white border border-slate-300 rounded px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-slate-900 shadow-sm transition-colors ${form.templateId ? 'opacity-80 bg-slate-50 cursor-not-allowed' : ''}`}
                      rows={5}
                      readOnly={!!form.templateId}
                      disabled={!!form.templateId}
                      value={form.description}
                      onChange={(e) => setForm({ ...form, description: e.target.value })}
                      placeholder="Contá qué entidades participan, qué hace cada una y cómo se relacionan entre sí..."
                    />
                  </div>

                  <div>
                    <label className="text-xs uppercase tracking-wide text-slate-500 font-display font-semibold">Nivel de detalle</label>
                    <div className="mt-1.5 flex gap-2">
                      {["basico", "avanzado"].map((lvl) => (
                        <button
                          key={lvl}
                          onClick={() => setForm({ ...form, detailLevel: lvl })}
                          className={
                            "flex-1 py-1.5 rounded text-xs font-display capitalize border transition-colors shadow-sm " +
                            (form.detailLevel === lvl ? "border-slate-900 text-white bg-slate-900" : "border-slate-300 text-slate-600 bg-white hover:border-slate-400")
                          }
                        >
                          {lvl}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button
                    onClick={handleGenerate}
                    disabled={!canGenerate}
                    className={
                      "mt-2 flex items-center justify-center gap-2 rounded py-2.5 font-display font-semibold text-sm transition-colors shadow-sm " +
                      (canGenerate ? "bg-slate-900 text-white hover:bg-slate-800" : "bg-slate-200 text-slate-400 cursor-not-allowed")
                    }
                  >
                    <Wand2 size={16} /> Generar diagrama
                  </button>
                  {!canGenerate && <p className="text-xs text-slate-500 -mt-2">Contanos un poco más sobre el sistema (mínimo unas palabras).</p>}
                </div>
              </div>
            </div>
          )}

          {}
          {step === "loading" && (
            <div className="flex-1 flex flex-col items-center justify-center gap-4 px-4 text-center bg-[#fafafa]">
              <Loader2 size={32} className="text-slate-900 animate-spin" />
              <p className="text-slate-600 text-sm font-display">Generando tu diagrama...</p>
            </div>
          )}

          {step === "editor" && (
            <>
              {/* TOOLBAR RESPONSIVA CON ORDEN SOLICITADO EXACTO */}
              <header className="no-print h-14 bg-slate-900 border-b border-slate-800 px-3 sm:px-4 flex items-center justify-between shrink-0 z-20 shadow-lg overflow-x-auto no-scrollbar whitespace-nowrap">
                <div className="flex items-center gap-3 shrink-0">
                  <div className="flex items-center gap-2">
                    <button onClick={startNewDiagram} className="text-slate-400 hover:text-slate-100 mr-1 sm:mr-2 p-1 rounded hover:bg-slate-800" title="Volver a inicio">
                      <ArrowLeft size={18} />
                    </button>
                    <input
                      className="font-display font-bold text-sm sm:text-lg text-slate-100 bg-transparent border border-transparent hover:border-slate-700 focus:border-cyan-500 focus:bg-slate-950 rounded focus:outline-none transition-colors px-1.5 py-0.5 -ml-1.5 w-[130px] sm:w-[220px]"
                      value={form.projectName}
                      onChange={(e) => setForm({ ...form, projectName: e.target.value })}
                      placeholder="Mi Proyecto"
                    />
                  </div>
                </div>

                {/* Controles Principales Reordenados */}
                <div className="flex items-center gap-1.5 sm:gap-2 shrink-0 pl-3">
                  
                  {/* 1. Zoom */}
                  <div className="flex items-center bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 gap-1">
                    <span className="text-[11px] font-display font-semibold text-slate-400 mr-1">Zoom</span>
                    <button onClick={() => setZoom((z) => Math.max(0.4, z - 0.1))} className="p-0.5 text-slate-400 hover:text-slate-100" title="Alejar">
                      <ZoomOutIcon size={14} />
                    </button>
                    <span className="text-[10px] font-mono text-slate-300 min-w-[32px] text-center">{Math.round(zoom * 100)}%</span>
                    <button onClick={() => setZoom((z) => Math.min(2.0, z + 0.1))} className="p-0.5 text-slate-400 hover:text-slate-100" title="Acercar">
                      <ZoomInIcon size={14} />
                    </button>
                  </div>

                  {/* 2. SQL */}
                  <button
                    onClick={() => setShowSqlModal(true)}
                    className="flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-cyan-300 font-mono font-semibold px-2.5 py-1.5 rounded-lg border border-slate-700"
                    title="Ver Script SQL DDL"
                  >
                    <CodeIcon size={15} /> SQL
                  </button>

                  {/* 2. Undo / Redo */}
                  <div className="flex items-center gap-1">
                    <button
                      disabled={historyIdx <= 0}
                      onClick={undo}
                      className="p-1.5 text-white hover:text-cyan-400 active:text-cyan-400 rounded bg-slate-950 border border-slate-800 transition-colors"
                      title="Deshacer"
                    >
                      <UndoIcon size={14} />
                    </button>
                    <button
                      disabled={historyIdx >= history.length - 1}
                      onClick={redo}
                      className="p-1.5 text-white hover:text-cyan-400 active:text-cyan-400 rounded bg-slate-950 border border-slate-800 transition-colors"
                      title="Rehacer"
                    >
                      <RedoIcon size={14} />
                    </button>
                  </div>

                  <div className="h-4 w-px bg-slate-800 my-auto" />

                  {/* 4. + Tabla */}
                  <button
                    onClick={createNewEntity}
                    className="flex items-center gap-1.5 text-xs bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition-colors shadow-md shadow-cyan-500/10"
                  >
                    <PlusIcon size={15} /> Tabla
                  </button>

                  {/* 5. Agregar flecha */}
                  <button
                    onClick={() => {
                      setToolMode(toolMode === "connect" ? "select" : "connect");
                      setConnectFrom(null);
                    }}
                    className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg font-semibold border transition-all ${toolMode === "connect" ? "bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20" : "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700"}`}
                  >
                    <LinkIcon size={15} /> {toolMode === "connect" ? "Seleccioná Destino..." : "Agregar flecha"}
                  </button>

                  <div className="h-4 w-px bg-slate-800 my-auto" />

                  <button
                    onClick={exportPNG}
                    className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700"
                    title="Descargar imagen PNG del diagrama"
                  >
                    <DownloadIcon size={15} />
                  </button>

                </div>
              </header>

              {}
              {/* LIENZO + PANEL LATERAL */}
              <div className="flex-1 flex flex-col md:flex-row overflow-hidden relative">
                {/* CANVAS CON SCROLL LIBRE EN CELULAR Y ESCRITORIO */}
                {/* //Soff aqui color */}
                <div
                  ref={canvasRef}
                  className={`flex-1 bg-slate-900 relative overflow-auto touch-canvas ${isPanning ? "cursor-grab active:cursor-grabbing" : "cursor-crosshair"}`}
                  onPointerDown={handlePointerDownCanvas}
                  onPointerMove={handlePointerMoveCanvas}
                  onPointerUp={handlePointerUpCanvas}
                  onPointerCancel={handlePointerUpCanvas}
                  onPointerLeave={handlePointerUpCanvas}
                >
                  <svg
                    ref={svgRef}
                    className="min-w-[2500px] min-h-[2500px] w-full h-full block"
                  >
                    <defs>
                      <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" strokeWidth="0.5" />
                      </pattern>
                    </defs>
                    <rect width="10000" height="10000" x="-5000" y="-5000" fill="url(#grid)" />

                    {/* RELACIONES / DIBUJO DE LÍNEAS TIPO BÉZIER CONECTORAS */}
                    <g id="diagram-group" transform={`translate(${pan.x}, ${pan.y}) scale(${zoom})`}>
                      {relationships.map((rel) => {
                        const fromEnt = getEntity(rel.from);
                        const toEnt = getEntity(rel.to);
                        if (!fromEnt || !toEnt) return null;

                        const { p1, p2, dx, dy } = getBestAnchor(fromEnt, toEnt);
                        const isSelected = rel.id === selectedRelId;

                        const ctrlX1 = p1.x + (Math.abs(dx) > Math.abs(dy) ? (p2.x > p1.x ? 60 : -60) : 0);
                        const ctrlY1 = p1.y + (Math.abs(dy) >= Math.abs(dx) ? (p2.y > p1.y ? 60 : -60) : 0);
                        const ctrlX2 = p2.x + (Math.abs(dx) > Math.abs(dy) ? (p2.x > p1.x ? -60 : 60) : 0);
                        const ctrlY2 = p2.y + (Math.abs(dy) >= Math.abs(dx) ? (p2.y > p1.y ? -60 : 60) : 0);

                        const pathData = `M ${p1.x} ${p1.y} C ${ctrlX1} ${ctrlY1}, ${ctrlX2} ${ctrlY2}, ${p2.x} ${p2.y}`;

                        return (
                          <g
                            key={rel.id}
                            onClick={(e) => {
                              e.stopPropagation();
                              setSelectedRelId(rel.id);
                              setSelectedEntityId(null);
                            }}
                            className="cursor-pointer group"
                          >
                            <path
                              d={pathData}
                              fill="none"
                              stroke={isSelected ? "#38bdf8" : "#475569"}
                              strokeWidth={isSelected ? 3 : 2}
                              strokeDasharray={rel.cardinalityFrom === "many" || rel.cardinalityTo === "many" ? "6,4" : "none"}
                            />
                            <g transform={`translate(${(p1.x + p2.x) / 2}, ${(p1.y + p2.y) / 2})`}>
                              <rect
                                x="-40"
                                y="-12"
                                width="80"
                                height="24"
                                rx="12"
                                fill="#090d16"
                                stroke={isSelected ? "#38bdf8" : "#334155"}
                                strokeWidth="1"
                              />
                              <text
                                x="0"
                                y="4"
                                textAnchor="middle"
                                fill="#94a3b8"
                                fontSize="10"
                                className="font-display font-medium"
                              >
                                {rel.label || "relación"}
                              </text>
                            </g>
                          </g>
                        );
                      })}

                      {/* ENTIDADES / TARJETAS DE TABLAS */}
                      {entities.map((ent) => {
                        const h = cardHeight(ent.attributes.length);
                        const isSelected = ent.id === selectedEntityId;
                        const isConnectSrc = ent.id === connectFrom;
                        const theme = COLOR_THEMES[ent.color] || COLOR_THEMES.cyan;

                        return (
                          <g
                            key={ent.id}
                            transform={`translate(${ent.x},${ent.y})`}
                            onPointerDown={(e) => handleEntityPointerDown(e, ent)}
                            onDoubleClick={(e) => {
                              e.stopPropagation();
                              setEditingEntityModalId(ent.id);
                            }}
                          >
                            <rect
                              width={CARD_W}
                              height={h}
                              rx="12"
                              fill="#090d16"
                              stroke={isConnectSrc ? "#f59e0b" : isSelected ? theme.badge : "#1e293b"}
                              strokeWidth={isSelected || isConnectSrc ? 2.5 : 1.5}
                              className="transition-shadow"
                            />

                            <path
                              d={`M 0 12 Q 0 0 12 0 L ${CARD_W - 12} 0 Q ${CARD_W} 0 ${CARD_W} 12 L ${CARD_W} ${HEADER_H} L 0 ${HEADER_H} Z`}
                              fill={isSelected ? "#1e293b" : "#0f172a"}
                            />

                            <rect x="0" y={HEADER_H - 2} width={CARD_W} height="2" fill={theme.badge} opacity="0.8" />

                            <text x="14" y="25" fontSize="13" fontWeight="700" fill="#f8fafc" className="font-mono">
                              {ent.name}
                            </text>

                            {isSelected && toolMode !== "connect" && (
                              <g
                                transform={`translate(${CARD_W - 65}, 8)`}
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setEditingEntityModalId(ent.id);
                                }}
                                className="cursor-pointer"
                              >
                                <rect width="55" height="22" rx="6" fill="#0284c7" />
                                <text x="27" y="15" fontSize="10" fontWeight="700" fill="#ffffff" textAnchor="middle" className="font-display">
                                  ✏️ Editar
                                </text>
                              </g>
                            )}

                            {ent.attributes.map((attr, i) => (
                              <g key={attr.id} transform={`translate(14, ${HEADER_H + 20 + i * ROW_H})`}>
                                {attr.pk && <text x="0" y="0" fontSize="10" fill="#f59e0b" fontWeight="bold">🔑</text>}
                                {attr.fk && !attr.pk && <text x="0" y="0" fontSize="10" fill="#38bdf8" fontWeight="bold">🔗</text>}

                                <text
                                  x={attr.pk || attr.fk ? "18" : "0"}
                                  y="0"
                                  fontSize="11"
                                  fill={attr.pk ? "#fbbf24" : "#e2e8f0"}
                                  className="font-mono"
                                  fontWeight={attr.pk ? "700" : "400"}
                                >
                                  {attr.name}
                                </text>

                                <text x={CARD_W - 28} y="0" textAnchor="end" fontSize="10" fill="#64748b" className="font-mono">
                                  {attr.type}
                                </text>
                              </g>
                            ))}
                          </g>
                        );
                      })}
                    </g>
                  </svg>
                </div>

                {/* PANEL LATERAL ORIGINAL INTACTO */}
                <aside className="no-print w-full md:w-80 shrink-0 border-t md:border-t-0 md:border-l border-slate-800 bg-slate-900 p-4 overflow-y-auto max-h-64 sm:max-h-80 md:max-h-full">
                  {selectedEntity ? (
                    <div className="flex flex-col gap-4">
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <label htmlFor="asideEntityName" className="text-xs uppercase tracking-wide text-slate-400 font-display font-semibold">Tabla Seleccionada</label>
                          <button
                            onClick={() => setEditingEntityModalId(selectedEntity.id)}
                            className="flex items-center gap-1 text-xs text-cyan-400 hover:text-cyan-300 font-semibold bg-cyan-950/50 px-2.5 py-1 rounded-lg border border-cyan-800/50"
                          >
                            <EditIcon size={13} /> Abrir Editor
                          </button>
                        </div>
                        <input
                          id="asideEntityName"
                          name="asideEntityName"
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-mono font-bold focus:outline-none focus:border-cyan-400"
                          value={selectedEntity.name}
                          onChange={(e) => updateEntity(selectedEntity.id, { name: e.target.value.toLowerCase().replace(/\s+/g, "_") })}
                        />
                      </div>

                      <div>
                        <label className="text-xs uppercase tracking-wide text-slate-400 font-display font-semibold mb-2 block">
                          Atributos ({selectedEntity.attributes.length})
                        </label>
                        <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                          {selectedEntity.attributes.map((attr) => (
                            <div key={attr.id} className="text-xs p-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-between font-mono">
                              <span className={attr.pk ? "text-amber-400 font-bold" : "text-slate-200"}>
                                {attr.pk ? "🔑 " : attr.fk ? "🔗 " : ""}{attr.name}
                              </span>
                              <span className="text-slate-500 text-[10px]">{attr.type}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <button
                        onClick={() => deleteEntity(selectedEntity.id)}
                        className="mt-2 flex items-center justify-center gap-2 text-xs text-red-400 border border-red-900/60 rounded-lg py-2 hover:bg-red-950/40 transition-colors"
                      >
                        <TrashIcon size={14} /> Eliminar esta entidad
                      </button>
                    </div>
                  ) : selectedRel ? (
                    <div className="flex flex-col gap-4">
                      <label className="text-xs uppercase tracking-wide text-slate-400 font-display font-semibold">Relación Seleccionada</label>
                      <div className="border border-slate-800 rounded-xl p-3 bg-slate-950 flex flex-col gap-3">
                        <div>
                          <label htmlFor="asideRelLabel" className="text-xs text-slate-400 mb-1 block">Etiqueta:</label>
                          <input
                            id="asideRelLabel"
                            name="asideRelLabel"
                            className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-100 font-display"
                            value={selectedRel.label || ""}
                            onChange={(e) => {
                              const updated = relationships.map((r) => (r.id === selectedRel.id ? { ...r, label: e.target.value } : r));
                              setRelationships(updated);
                            }}
                          />
                        </div>
                      </div>
                      <button
                        onClick={() => {
                          const updated = relationships.filter((r) => r.id !== selectedRel.id);
                          setRelationships(updated);
                          setSelectedRelId(null);
                        }}
                        className="flex items-center justify-center gap-2 text-xs text-red-400 border border-red-900/60 rounded-lg py-2 hover:bg-red-950/40 transition-colors"
                      >
                        <TrashIcon size={14} /> Eliminar relación
                      </button>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-4 text-xs text-slate-400">
                      <div className="border-b border-slate-800 pb-3">
                        <h2 className="font-display font-bold text-sm text-slate-200 mb-1">Diagrama Entidad-Relación</h2>
                        <p>{entities.length} tablas · {relationships.length} relaciones</p>
                      </div>

                      <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                        <h3 className="font-display font-semibold text-slate-300 text-xs">💡 Controles de Lienzo</h3>
                        <ul className="space-y-1.5 text-slate-400 text-[11px]">
                          <li>• <strong>Exportar SQL</strong>: En la barra superior encontrarás <strong>SQL</strong>, el cual te dará el código listo para copiar y armar tu base de datos.</li>
                          <li>• <strong>Agregar flecha</strong>: Debes apretar el botón, luego seleccionar la tabla de origen y por último seleccionar la tabla destino para conectarlas.</li>
                          <li>• <strong>Más herramientas</strong>: Se puede agregar tabla, hacer zoom, volver para atrás o regresar hacia adelante, descargar imagen y obtener código SQL.</li>
                        </ul>
                      </div>
                    </div>
                  )}
                </aside>
              </div>

              {/* MODAL EDITAR ENTIDAD */}
              {editingEntityModalId && (
                <EntityEditModal
                  entity={modalEntity}
                  onClose={() => setEditingEntityModalId(null)}
                  onUpdateEntity={updateEntity}
                  onAddAttr={addAttribute}
                  onDeleteAttr={deleteAttribute}
                  onUpdateAttr={updateAttribute}
                  onMoveAttr={moveAttribute}
                />
              )}

              {/* MODAL GENERADOR SQL */}
              {showSqlModal && (
                <SqlExportModal
                  entities={entities}
                  relationships={relationships}
                  onClose={() => setShowSqlModal(false)}
                />
              )}
              
              {/* MODAL DE CONFIRMACIÓN AL VOLVER */}
              {showConfirmModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-in fade-in">
                  <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden zoom-in-95">
                    <div className="p-6">
                      <h3 className="font-display font-bold text-lg text-slate-100 mb-2">¿Volver al inicio?</h3>
                      <p className="text-sm text-slate-400">Si volvés al inicio se perderá el diagrama actual. ¿Estás seguro de que querés descartarlo?</p>
                    </div>
                    <div className="px-6 py-4 bg-slate-950/50 border-t border-slate-800 flex justify-end gap-3 shrink-0">
                      <button
                        onClick={() => setShowConfirmModal(false)}
                        className="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-white transition-colors"
                      >
                        Cancelar
                      </button>
                      <button
                        onClick={confirmStartNewDiagram}
                        className="px-4 py-2 text-sm font-semibold bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white rounded-lg border border-red-500/20 transition-colors"
                      >
                        Sí, descartar
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ERDiagramStudio />);
  </script>
</body>
</html>
